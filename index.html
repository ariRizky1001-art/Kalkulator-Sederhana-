<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator sederhana</title>
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculator">
    <div class="display">
      <div id="historyDisplay"></div>
      <div id="currentDisplay">0</div>
    </div>
    
    <div class="buttons">
      <button class="operator" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="inputNumber('(')">(</button>
      <button class="operator" onclick="inputNumber(')')">)</button>
      <button class="operator" onclick="inputOperator('*')">x</button>
      
      <button onclick="inputNumber('7')">7</button>
      <button onclick="inputNumber('8')">8</button>
      <button onclick="inputNumber('9')">9</button>
      <button class="operator" onclick="inputOperator('/')">÷</button>
      
      <button onclick="inputNumber('4')">4</button>
      <button onclick="inputNumber('5')">5</button>
      <button onclick="inputNumber('6')">6</button>
      <button class="operator" onclick="inputOperator('+')">+</button>
      
      <button onclick="inputNumber('1')">1</button>
      <button onclick="inputNumber('2')">2</button>
      <button onclick="inputNumber('3')">3</button>
      <button class="operator" onclick="inputOperator('-')">-</button>
      
      <button class="operator" onclick="backspace()">⌫</button>
      <button onclick="inputNumber('0')">0</button>
      <button onclick="inputNumber('.')">,</button>
      <button id="equal" onclick="calculate()">=</button>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>

</html>
